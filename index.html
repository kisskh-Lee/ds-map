<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>드래곤소드 마스터 맵스 (v2.2)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; background: #000000; }
        
        /* 사이드바 스타일 */
        .side-nav { 
            position: fixed; top: 0; left: 0; width: 280px; height: 100%; 
            background: rgba(25, 25, 25, 0.98); color: #eee; z-index: 2000; 
            box-shadow: 4px 0 20px rgba(0,0,0,0.7); 
            transition: transform 0.3s ease; transform: translateX(-100%); 
            display: flex; flex-direction: column; border-right: 1px solid #444;
        }
        .side-nav.open { transform: translateX(0); }
        .nav-content { display: flex; flex-direction: column; padding: 0 15px 15px 15px; gap: 10px; overflow-y: auto; height: 100%; }
        
        .logo-title { padding: 12px 15px 12px 60px; border-bottom: 1px dashed #555; margin-bottom: 10px; min-height: 45px; }
        .logo-title h1 { font-size: 20px; font-weight: 900; color: #ffce00; margin: 0; letter-spacing: 1px; }

        .menu-toggle { 
            position: fixed; top: 12px; left: 12px; z-index: 2100; 
            background: #ffce00; color: #222; border: none; 
            width: 38px; height: 38px; border-radius: 6px; cursor: pointer; 
            font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }

        /* 모달 팝업 스타일 */
        #markerModal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.98); padding: 25px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,1); z-index: 3000;
            border: 2px solid #ffce00; width: 320px; color: white;
        }
        .modal-help { font-size: 11px; color: #bbb; margin-bottom: 15px; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 6px; max-height: 180px; overflow-y: auto; line-height: 1.5; border: 1px solid #333; }
        
        #markerModal input, #markerModal select {
            width: 100%; padding: 10px; background: #111; border: 1px solid #444;
            color: white; border-radius: 5px; box-sizing: border-box; outline: none; margin-bottom: 12px;
        }
        #markerModal label { font-size: 12px; color: #ffce00; font-weight: bold; display: block; margin-bottom: 4px; }

        /* 탐사도 스타일 */
        .region-section { margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 6px; }
        .region-card { margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .region-name { font-size: 13px; font-weight: bold; color: #ffce00; display: flex; justify-content: space-between; }
        .prog-bar-bg { background: #222; height: 6px; border-radius: 3px; margin: 6px 0; overflow: hidden; }
        .prog-bar-fill { background: #ffce00; height: 100%; width: 0%; transition: width 0.4s; }
        .prog-text { font-size: 11px; color: #aaa; }

        /* 필터 스타일 */
        .category-container { margin-bottom: 5px; border-radius: 4px; background: rgba(255,255,255,0.03); }
        .category-header { padding: 10px 12px; background: #333; font-weight: bold; color: #ffce00; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; }
        .category-items { padding: 12px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 5px; }
        .category-items.collapsed { display: none; }
        .filter-item { display: flex; align-items: center; gap: 6px; font-weight: 700; cursor: pointer; font-size: 12px; color: #ccc; }
        .filter-icon { width: 22px; height: 22px; }

        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: auto; padding: 15px 0; }
        .action-btn { cursor: pointer; padding: 10px; border-radius: 5px; font-size: 13px; font-weight: 700; border: none; color: #fff !important; width: 100%; }

        #loadingOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 9999; color: #ffce00;
            flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div style="font-size: 20px; font-weight: bold;" id="loadingText">데이터 동기화 중...</div>
</div>

<button class="menu-toggle" onclick="toggleNav()" id="toggleBtn">☰</button>

<div class="side-nav" id="sideNav">
    <div class="logo-title"><h1>DRAGON SWORD</h1></div>
    <div class="nav-content">
        <div id="categoryRoot"></div>
        
        <div class="region-section">
            <h4 style="margin: 0 0 10px 0; color: #ffce00; font-size: 14px; border-left: 3px solid #ffce00; padding-left: 8px;">지역 탐사도</h4>
            <div id="regionProgressList"></div>
        </div>

        <div class="btn-group">
            <button class="action-btn" style="background:#2e7d32" onclick="exportToJsFile()">💾 로컬 저장 (data.js)</button>
            <button class="action-btn" style="background:#1565c0" onclick="document.getElementById('importFile').click()">📂 로컬 로드</button>
            <input type="file" id="importFile" style="display:none" onchange="importFromFile(this)">
            <button class="action-btn" style="background:#c62828" onclick="clearAllMarkers()">🗑️ 전체 초기화</button>
        </div>
        <div style="padding: 10px; font-size: 10px; color: #666; text-align: center;">Cloud Sync v2.2</div>
    </div>
</div>

<div id="markerModal">
    <h3 style="text-align:center; color:#ffce00; margin-top:0;">새 마커 등록</h3>
    <div class="modal-help" id="modalHelpText"></div>
    
    <label>1. 번호 입력</label>
    <input type="number" id="inputNum" placeholder="번호 입력 (1~16)" onkeydown="if(event.key==='Enter') document.getElementById('inputNote').focus()">
    
    <label>2. 메모</label>
    <input type="text" id="inputNote" placeholder="메모 입력" onkeydown="if(event.key==='Enter') document.getElementById('inputRegion').focus()">
    
    <label>3. 지역 선택</label>
    <select id="inputRegion">
        <option value="" disabled selected>지역을 선택하세요</option>
        <option value="오르비스 왕성">오르비스 왕성</option>
        <option value="시작의 초원">시작의 초원</option>
        <option value="풍요의 대지">풍요의 대지</option>
        <option value="그림자 삼림">그림자 삼림</option>
        <option value="산들바람 언덕">산들바람 언덕</option>
        <option value="강철심장 요새">강철심장 요새</option>
        <option value="용오름 분지">용오름 분지</option>
        <option value="안개장막 고지대">안개장막 고지대</option>
        <option value="하늘마루 구릉지">하늘마루 구릉지</option>
    </select>
    
    <div style="display:flex; gap:8px; margin-top:5px;">
        <button style="flex:1; padding:10px; background:#444; border:none; color:#ccc; border-radius:5px; cursor:pointer;" onclick="closeModal()">취소</button>
        <button style="flex:1; padding:10px; background:#ffce00; border:none; color:#222; font-weight:bold; border-radius:5px; cursor:pointer;" onclick="confirmMarker()">등록</button>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script>
    // ★★★ 중요: 본인의 구글 웹 앱 URL을 여기에 붙여넣으세요 ★★★
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLRNMwZkLQg23uBYxViQSFkaymc0z0cJHMhIio_H6J7GTx6nqviihDt1sn3JWYr1I/exec";

    // 지역별 목표치 (상자 목표는 1+2번 통합, 미니게임은 3번)
    const regionGoals = {
        "오르비스 왕성": { "상자": 94, "미니게임": 6 },
        "시작의 초원": { "상자": 90, "미니게임": 4 },
        "풍요의 대지": { "상자": 156, "미니게임": 6 },
        "그림자 삼림": { "상자": 105, "미니게임": 8 },
        "산들바람 언덕": { "상자": 96, "미니게임": 8 },
        "강철심장 요새": { "상자": 115, "미니게임": 6 },
        "용오름 분지": { "상자": 159, "미니게임": 5 },
        "안개장막 고지대": { "상자": 111, "미니게임": 7 },
        "하늘마루 구릉지": { "상자": 105, "미니게임": 7 }
    };

    const types = {
        "1": { name: "상자", icon: "box.png" }, 
        "2": { name: "퍼즐", icon: "puzzle.png" },
        "3": { name: "미니게임", icon: "minigame.png" }, 
        "4": { name: "돌발 퀘스트", icon: "quest.png" },
        "5": { name: "유령", icon: "ghost.png" }, 
        "6": { name: "유령 목적지", icon: "ghost_end.png" },
        "7": { name: "이벤트", icon: "event.png" }, 
        "8": { name: "새알", icon: "egg.png" },
        "9": { name: "기억", icon: "item9.png" }, 
        "10": { name: "추억", icon: "item10.png" },
        "11": { name: "회상", icon: "item11.png" }, 
        "12": { name: "망각", icon: "item12.png" },
        "13": { name: "생기", icon: "item13.png" }, 
        "14": { name: "순수", icon: "item14.png" },
        "15": { name: "태고", icon: "item15.png" }, 
        "16": { name: "활력", icon: "item16.png" }
    };

    const categoryData = [
        { name: "보물", types: ["1", "2", "3"] }, 
        { name: "몬스터", types: ["4"] },        
        { name: "일상", types: ["5", "6", "7", "8"] }, 
        { name: "재료", types: ["9", "10", "11", "12", "13", "14", "15", "16"] }
    ];

    // 지도 엔진 초기화
    const map = L.map('map', { 
        crs: L.CRS.Simple, minZoom: -4, maxZoom: 3, zoomSnap: 0.1, zoomControl: false,
        zoomAnimation: false, markerZoomAnimation: false, fadeAnimation: false
    });
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const bounds = [[-4096, -4096], [4096, 4096]];
    L.imageOverlay('map.webp', bounds).addTo(map);
    map.fitBounds(bounds);

    const clusters = L.markerClusterGroup({ maxClusterRadius: 50, disableClusteringAtZoom: 1, animate: false });
    map.addLayer(clusters);

    // 사이드바 카테고리 생성
    const root = document.getElementById('categoryRoot');
    categoryData.forEach((cat, idx) => {
        let itemsHtml = '';
        cat.types.forEach(tid => {
            const t = types[tid];
            itemsHtml += `<label class="filter-item"><input type="checkbox" checked onchange="filterMarkers('${t.name}', this.checked)"> <img src="IMAGE/${t.icon}" class="filter-icon" onerror="this.style.opacity='0.3'"> <span>${t.name}</span></label>`;
        });
        root.innerHTML += `<div class="category-container"><div class="category-header" onclick="toggleCategory('cat-${idx}')"><span>${cat.name}</span><span id="arrow-cat-${idx}">▼</span></div><div id="cat-${idx}" class="category-items">${itemsHtml}</div></div>`;
    });

    let savedMarkers = [];
    const markerLayers = {}; 
    let visibleTypes = {};
    Object.values(types).forEach(t => visibleTypes[t.name] = true);

    // 클라우드 동기화 로직
    async function syncFromCloud() {
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            savedMarkers = data;
            clusters.clearLayers();
            savedMarkers.forEach(drawMarker);
            updateRegionProgress();
            localStorage.setItem('ds_markers_v2', JSON.stringify(savedMarkers));
        } catch (e) {
            savedMarkers = JSON.parse(localStorage.getItem('ds_markers_v2')) || [];
            savedMarkers.forEach(drawMarker);
            updateRegionProgress();
        }
        showLoading(false);
    }

    function toggleCategory(id) {
        const el = document.getElementById(id);
        const arrow = document.getElementById(`arrow-${id}`);
        el.classList.toggle('collapsed');
        arrow.innerText = el.classList.contains('collapsed') ? '▶' : '▼';
    }

    function toggleNav() {
        const nav = document.getElementById('sideNav');
        nav.classList.toggle('open');
        document.getElementById('toggleBtn').innerHTML = nav.classList.contains('open') ? "✕" : "☰";
    }

    // 마커 등록 안내 메시지 (가독성 개선 버전)
    map.on('contextmenu', e => {
        const modal = document.getElementById('markerModal');
        const help = document.getElementById('modalHelpText');
        
        let helpMsg = "<b style='color:#ffce00;'>[주요 마커]</b><br>";
        helpMsg += "<div style='display:grid; grid-template-columns: 1fr 1fr; gap:2px; margin-top:5px;'>";
        helpMsg += "<span>1:상자</span> <span>2:퍼즐</span>";
        helpMsg += "<span>3:미니게임</span> <span>4:돌발퀘</span>";
        helpMsg += "<span>5:유령</span> <span>6:유령도착</span>";
        helpMsg += "<span>7:이벤트</span> <span>8:새알</span>";
        helpMsg += "</div>";
        helpMsg += "<hr style='border:0; border-top:1px dashed #555; margin:8px 0;'>";
        helpMsg += "<b style='color:#ffce00;'>[재료]</b> 9:기억, 10:추억, 11:회상, 12:망각, 13:생기, 14:순수, 15:태고, 16:활력";
        
        help.innerHTML = helpMsg;
        modal.style.display = 'block';
        window.tempLatLng = e.latlng;
        document.getElementById('inputNum').value = "";
        document.getElementById('inputNote').value = "";
        document.getElementById('inputRegion').selectedIndex = 0;
        document.getElementById('inputNum').focus();
    });

    function closeModal() { document.getElementById('markerModal').style.display = 'none'; }

    async function confirmMarker() {
        const num = document.getElementById('inputNum').value;
        const note = document.getElementById('inputNote').value;
        const region = document.getElementById('inputRegion').value;
        if (!types[num]) return alert("번호를 확인해주세요.");
        if (!region) return alert("지역을 선택해주세요.");
        const newM = { id: Date.now(), lat: window.tempLatLng.lat, lng: window.tempLatLng.lng, type: types[num].name, note: note, region: region };
        showLoading(true);
        try {
            await fetch(`${SCRIPT_URL}?action=add`, { method: "POST", body: JSON.stringify(newM) });
            savedMarkers.push(newM);
            localStorage.setItem('ds_markers_v2', JSON.stringify(savedMarkers));
            drawMarker(newM);
            updateRegionProgress();
            closeModal();
        } catch(e) { alert("클라우드 저장 실패!"); }
        showLoading(false);
    }

    function drawMarker(data) {
        const typeInfo = Object.values(types).find(t => t.name === data.type) || { icon: "unknown.png" };
        const marker = L.marker([data.lat, data.lng], { 
            icon: L.icon({ iconUrl: `IMAGE/${typeInfo.icon}`, iconSize: [30, 30], iconAnchor: [15, 15] }) 
        });
        marker.bindPopup(`<b>[${data.region}] ${data.type}</b><br>${data.note || ''}<br><button onclick="deleteMarker(${data.id})" style="background:#ff4757; color:white; border:none; padding:3px 8px; border-radius:3px; cursor:pointer; margin-top:5px; width:100%;">삭제</button>`);
        markerLayers[data.id] = marker; 
        if (visibleTypes[data.type]) clusters.addLayer(marker);
    }

    // 지역 탐사도 계산 (상자+퍼즐 통합 버전)
    function updateRegionProgress() {
        const listEl = document.getElementById('regionProgressList');
        listEl.innerHTML = "";
        Object.keys(regionGoals).forEach(rName => {
            const goal = regionGoals[rName];
            const current = { "상자": 0, "퍼즐": 0, "미니게임": 0 };
            savedMarkers.forEach(m => {
                if (m.region === rName && current[m.type] !== undefined) current[m.type]++;
            });

            // 계산: 1번(상자) + 2번(퍼즐) 합산하여 '상자' 목표량과 비교
            const currentBoxSum = current["상자"] + current["퍼즐"];
            const currentMiniSum = current["미니게임"];
            
            const boxCountForProg = Math.min(currentBoxSum, goal["상자"]);
            const miniCountForProg = Math.min(currentMiniSum, goal["미니게임"]);
            
            const totalGoal = goal["상자"] + goal["미니게임"];
            const percent = Math.floor(((boxCountForProg + miniCountForProg) / totalGoal) * 100);
            
            listEl.innerHTML += `
                <div class="region-card">
                    <div class="region-name"><span>${rName}</span><span>${percent}%</span></div>
                    <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${percent}%"></div></div>
                    <div class="prog-text">상자+퍼즐 ${currentBoxSum}/${goal["상자"]} | 미니게임 ${currentMiniSum}/${goal["미니게임"]}</div>
                </div>`;
        });
    }

    window.filterMarkers = (typeName, isVisible) => {
        visibleTypes[typeName] = isVisible;
        savedMarkers.forEach(m => {
            if (m.type === typeName) {
                if (isVisible) clusters.addLayer(markerLayers[m.id]);
                else clusters.removeLayer(markerLayers[m.id]);
            }
        });
    };

    window.deleteMarker = async id => {
        if(confirm("삭제하시겠습니까?")){ 
            showLoading(true);
            try {
                await fetch(`${SCRIPT_URL}?action=delete&id=${id}`, { method: "POST" });
                clusters.removeLayer(markerLayers[id]); 
                savedMarkers = savedMarkers.filter(m => m.id !== id); 
                localStorage.setItem('ds_markers_v2', JSON.stringify(savedMarkers)); 
                updateRegionProgress();
            } catch(e) { alert("삭제 처리 실패!"); }
            showLoading(false);
        }
    };

    function showLoading(show) { document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; }
    function exportToJsFile() {
        const blob = new Blob(["const data = " + JSON.stringify(savedMarkers, null, 2) + ";"], {type: "text/javascript"});
        const dl = document.createElement('a'); dl.href = URL.createObjectURL(blob); dl.download = "data.js"; dl.click();
    }
    function importFromFile(input) {
        const reader = new FileReader();
        reader.onload = async e => {
            let content = e.target.result;
            if(content.includes("const data =")) content = content.replace("const data =", "").replace(/;$/, "");
            const imported = JSON.parse(content);
            if(confirm("데이터를 덮어씌울까요?")) {
                savedMarkers = imported;
                localStorage.setItem('ds_markers_v2', JSON.stringify(savedMarkers));
                location.reload();
            }
        };
        reader.readAsText(input.files[0]);
    }
    function clearAllMarkers() { 
        if(confirm("모든 마커를 삭제할까요?")){ 
            clusters.clearLayers(); 
            savedMarkers = []; 
            localStorage.setItem('ds_markers_v2', JSON.stringify(savedMarkers)); 
            updateRegionProgress(); 
        } 
    }
    map.on('click', () => { closeModal(); if (document.getElementById('sideNav').classList.contains('open')) toggleNav(); });
    syncFromCloud();
</script>
</body>
</html>
